<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>안전점검 보고서 장별 보기</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="page-header">
    <p class="eyebrow">2026 행정안전부 안전점검 결과 보고서</p>
    <h1>장별 카드 보기</h1>
  </header>

  <main class="container">
    <section class="toolbar" aria-label="검색">
      <label for="search" class="sr-only">키워드 검색</label>
      <div class="search-box">
        <svg aria-hidden="true" viewBox="0 0 24 24" class="search-icon"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="search" type="search" placeholder="제목·본문 키워드 검색 (예: 450건, 권혁수, 예산)" autocomplete="off">
        <button id="clear" type="button" class="clear-btn" hidden aria-label="검색어 지우기">×</button>
      </div>
      <p id="result-count" class="result-count" aria-live="polite">불러오는 중…</p>
    </section>

    <!-- 장데이터.json을 불러오지 못했을 때(파일을 직접 더블클릭해 연 경우 등)만 표시 -->
    <section id="loader" class="loader" hidden>
      <p>장데이터.json을 자동으로 불러오지 못했습니다. 파일을 직접 선택해 주세요.</p>
      <label class="file-btn">
        장데이터.json 선택
        <input id="file-input" type="file" accept=".json,application/json">
      </label>
    </section>

    <section id="cards" class="cards" aria-label="장 목록"></section>
    <p id="empty" class="empty" hidden>검색 결과가 없습니다.</p>
  </main>

  <script src="app.js"></script>
</body>
</html>
